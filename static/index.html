<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>全国旅游热度 AI 洞察看板</title>
  <style>
    :root {
      --bg: #07111f;
      --bg-glow: #0a1a33;
      --panel: rgba(15, 28, 51, 0.82);
      --panel-border: #1c3553;
      --text: #e6f1ff;
      --text-dim: #8aa8c8;
      --accent: #22d3ee;
      --accent-2: #38bdf8;
      --good: #34d399;
      --warn: #f59e0b;
      --bad: #f87171;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 14px;
      line-height: 1.6;
      background:
        radial-gradient(1200px 600px at 15% -10%, #0f2a4a 0%, transparent 55%),
        radial-gradient(1000px 500px at 100% 0%, #0a2440 0%, transparent 50%),
        var(--bg);
    }
    .wrap { max-width: 1440px; margin: 0 auto; padding: 18px 22px 40px; }

    /* ===== 顶栏 ===== */
    .header { display: flex; align-items: center; gap: 14px; padding: 8px 4px 18px; }
    .header .logo { font-size: 24px; font-weight: 800; letter-spacing: 1px;
      background: linear-gradient(90deg, #38bdf8, #22d3ee, #34d399);
      -webkit-background-clip: text; background-clip: text; color: transparent; }
    .header .spacer { flex: 1; }
    .update-time { color: var(--text-dim); font-size: 13px; }
    .update-time b { color: var(--accent); font-weight: 700; }

    /* ===== 卡片 ===== */
    .panel {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      padding: 16px 18px;
      backdrop-filter: blur(6px);
    }
    .panel h2 {
      font-size: 15px; font-weight: 700; margin: 0 0 12px;
      display: flex; align-items: center; gap: 8px;
    }
    .panel h2::before { content: ""; width: 4px; height: 16px; border-radius: 2px;
      background: linear-gradient(var(--accent), var(--accent-2)); }

    /* ===== AI 综述卡 ===== */
    .overview-card { margin-bottom: 16px; }
    .overview-text { font-size: 15px; line-height: 1.9; color: #d7e8fb; white-space: pre-wrap; }
    .overview-text .tag { color: var(--accent); font-weight: 600; }
    .skeleton { border-radius: 6px; height: 18px;
      background: linear-gradient(90deg, #12263f 25%, #1c3a5f 50%, #12263f 75%);
      background-size: 200% 100%; animation: shimmer 1.4s infinite; }
    .skeleton + .skeleton { margin-top: 10px; }
    .skeleton.short { width: 55%; }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    /* ===== 主体分栏 ===== */
    .main { display: grid; grid-template-columns: 70fr 30fr; gap: 16px; margin-bottom: 16px; }
    .right-col { display: flex; flex-direction: column; gap: 16px; }
    .chart { width: 100%; height: 320px; }
    #chart-map { height: 100%; min-height: 560px; }
    .map-panel { height: 100%; }

    /* ===== 推荐表单 ===== */
    .form-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
    .field { display: flex; flex-direction: column; gap: 5px; }
    .field label { font-size: 12px; color: var(--text-dim); }
    .field input, .field select {
      font-family: inherit; font-size: 13px; color: var(--text);
      background: #0a1830; border: 1px solid var(--panel-border);
      border-radius: 8px; padding: 9px 12px; min-width: 130px; outline: none;
    }
    .field input:focus, .field select:focus { border-color: var(--accent); }
    button.primary {
      font-family: inherit; font-size: 14px; font-weight: 700; color: #04121f;
      background: linear-gradient(90deg, #38bdf8, #22d3ee); border: none;
      border-radius: 8px; padding: 10px 22px; cursor: pointer; white-space: nowrap;
    }
    button.primary:hover { filter: brightness(1.08); }
    button.primary:disabled { opacity: 0.6; cursor: not-allowed; }
    .recommend-result { margin-top: 14px; min-height: 40px; color: #d7e8fb;
      font-size: 14px; line-height: 1.9; white-space: pre-wrap; }

    /* ===== 城市详情弹窗 ===== */
    .modal-mask { position: fixed; inset: 0; background: rgba(3, 8, 18, 0.66);
      display: none; align-items: center; justify-content: center; z-index: 50; padding: 20px; }
    .modal-mask.show { display: flex; }
    .modal { width: min(560px, 100%); background: #0e1c33; border: 1px solid #24415f;
      border-radius: 16px; padding: 22px; max-height: 80vh; overflow-y: auto; }
    .modal .title { font-size: 20px; font-weight: 800; margin: 0 0 4px; }
    .modal .sub { color: var(--text-dim); font-size: 13px; margin-bottom: 14px; }
    .modal .metrics { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
    .metric { background: #0a1830; border: 1px solid var(--panel-border);
      border-radius: 8px; padding: 8px 14px; }
    .metric .k { font-size: 12px; color: var(--text-dim); }
    .metric .v { font-size: 18px; font-weight: 700; color: var(--accent); }
    .modal .ai-title { color: var(--accent); font-size: 13px; font-weight: 700; margin-bottom: 6px; }
    .modal .ai-body { color: #d7e8fb; line-height: 1.9; white-space: pre-wrap; min-height: 30px; }
    .modal .close {
      float: right; background: transparent; border: none; color: var(--text-dim);
      font-size: 22px; cursor: pointer; line-height: 1;
    }

    .empty { color: var(--text-dim); text-align: center; padding: 40px 0; }

    @media (max-width: 960px) {
      .main { grid-template-columns: 1fr; }
      #chart-map { min-height: 400px; }
      .header { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <!-- 顶部标题栏 -->
    <header class="header">
      <div class="logo">全国旅游热度 AI 洞察看板</div>
      <div class="spacer"></div>
      <div class="update-time">数据更新时间：<b id="update-time">—</b></div>
    </header>

    <!-- 顶部 AI 综述区 -->
    <section class="panel overview-card">
      <h2>今日 AI 热度综述</h2>
      <div id="overview-body">
        <div class="skeleton"></div>
        <div class="skeleton short"></div>
        <div class="skeleton"></div>
      </div>
    </section>

    <!-- 中间主体：左地图 + 右两图 -->
    <section class="main">
      <div class="panel map-panel">
        <h2>全国城市热度热力图</h2>
        <div id="chart-map"><div class="empty">地图加载中…</div></div>
      </div>
      <div class="right-col">
        <div class="panel">
          <h2>TOP10 热门城市</h2>
          <div class="chart" id="chart-top10"></div>
        </div>
        <div class="panel">
          <h2>近7天全国热度趋势</h2>
          <div class="chart" id="chart-trend"></div>
        </div>
      </div>
    </section>

    <!-- 底部 AI 推荐区 -->
    <section class="panel">
      <h2>AI 目的地推荐</h2>
      <div class="form-row">
        <div class="field">
          <label>出发地</label>
          <input id="f-origin" placeholder="如：北京" />
        </div>
        <div class="field">
          <label>游玩天数</label>
          <select id="f-days">
            <option>1</option><option>2</option><option selected>3</option>
            <option>4</option><option>5</option><option>6</option><option>7</option>
          </select>
        </div>
        <div class="field">
          <label>预算</label>
          <select id="f-budget">
            <option>经济</option><option selected>中等</option><option>充裕</option>
          </select>
        </div>
        <div class="field">
          <label>喜好</label>
          <input id="f-pref" placeholder="如：自然风光 / 美食 / 亲子" />
        </div>
        <button class="primary" id="btn-recommend">获取推荐</button>
      </div>
      <div class="recommend-result" id="recommend-result">填写偏好，点击按钮获取 AI 推荐～</div>
    </section>
  </div>

  <!-- 城市详情弹窗 -->
  <div class="modal-mask" id="modal-mask">
    <div class="modal">
      <button class="close" id="modal-close">&times;</button>
      <div class="title" id="m-title">—</div>
      <div class="sub" id="m-sub">—</div>
      <div class="metrics" id="m-metrics"></div>
      <div class="ai-title">AI 热度解读 · 出行小贴士</div>
      <div class="ai-body" id="m-ai">正在生成解读…</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <script>
    // ===== 全局状态 =====
    const GEO_URL = '/static/china.json';  // 本地城市级 GeoJSON（已合并直辖市+地级市）
    const state = { top10: [], trend: [] };
    const charts = {};

    function el(id) { return document.getElementById(id); }
    function initChart(id) {
      const dom = el(id); if (!dom || typeof echarts === 'undefined') return null;
      if (charts[id]) charts[id].dispose();
      charts[id] = echarts.init(dom);
      return charts[id];
    }
    function textColor() { return '#8aa8c8'; }

    // ===== 数据加载 =====
    async function loadJSON(url) {
      const res = await fetch(url);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }
    function showMapStatus(msg) {
      el('chart-map').innerHTML = '<div class="empty">' + msg + '</div>';
    }
    // 全国城市热度热力图：简单顺序 async/await，无状态对象与守卫
    async function initMap() {
      const container = el('chart-map');
      if (typeof echarts === 'undefined') { showMapStatus('图表库 echarts 加载失败，请检查网络'); return; }
      container.innerHTML = ''; // 清空初始占位，交给 ECharts 管理
      const chart = echarts.init(container);
      charts['chart-map'] = chart;
      chart.showLoading({ text: '加载中…', color: '#22d3ee', textColor: '#8aa8c8', maskColor: 'rgba(4,10,22,0.6)', fontSize: 13 });

      try {
        // ① 拉取 GeoJSON
        const geoRes = await fetch(GEO_URL);
        if (!geoRes.ok) throw new Error('地图资源不可用（HTTP ' + geoRes.status + '）');
        const geoJson = await geoRes.json();

        // ② 注册地图
        echarts.registerMap('china', geoJson);

        // ③ 拉取城市热度数据
        const dataRes = await fetch('/api/map-data');
        if (!dataRes.ok) throw new Error('热度接口不可用（HTTP ' + dataRes.status + '）');
        const dataJson = await dataRes.json();
        if (dataJson.code !== 0) throw new Error(dataJson.msg || '热度数据异常');
        // 兼容两种返回结构：data 直接是数组，或 data 是 {date, data:[...]}
        const payload = dataJson.data;
        const rows = Array.isArray(payload) ? payload : ((payload && payload.data) || []);
        if (!Array.isArray(rows) || rows.length === 0) throw new Error('暂无热度数据，请先执行数据采集');

        // ④ 名称兼容匹配：兼容「北京」「北京市」两种格式，并打印匹配结果
        const geoNames = new Set(geoJson.features.map(f => f.properties && f.properties.name));
        const matchName = city => {
          if (geoNames.has(city)) return city;
          for (const suffix of ['市', '省', '自治区', '特别行政区']) {
            if (geoNames.has(city + suffix)) return city + suffix;
          }
          return null; // null 表示未匹配到地图要素
        };
        const matched = [];
        const unmatched = [];
        const data = [];
        rows.forEach(r => {
          const city = r.city || r.name;
          const mapName = matchName(city);
          if (mapName) { matched.push(city); data.push({ name: mapName, city: city, value: r.value }); }
          else { unmatched.push(city); }
        });
        console.log('[地图] 匹配成功 ' + matched.length + ' 城：' + matched.join('、'));
        if (unmatched.length) console.warn('[地图] 匹配失败 ' + unmatched.length + ' 城：' + unmatched.join('、'));
        if (!data.length) throw new Error('城市名称与地图要素均未匹配，请检查名称规则');

        // ⑤ 配置并渲染热力图，隐藏加载提示
        const values = data.map(d => d.value);
        const min = Math.floor(Math.min(...values) / 5) * 5;
        const max = Math.ceil(Math.max(...values) / 5) * 5;
        chart.hideLoading();
        chart.setOption({
          backgroundColor: 'transparent',
          tooltip: {
            trigger: 'item',
            formatter: p => p.data.city
              ? `${p.data.city}<br/>综合热度：<b>${p.value}</b>`
              : p.name + '<br/>暂无数据',
          },
          visualMap: {
            min, max, left: 16, bottom: 12, text: ['高', '低'],
            textStyle: { color: textColor() }, calculable: true, itemWidth: 12, itemHeight: 120,
            inRange: { color: ['#1e3a8a', '#0ea5e9', '#10b981', '#eab308', '#ef4444'] },
          },
          series: [{
            type: 'map', map: 'china', roam: true, zoom: 1.08, data,
            label: { show: false },
            itemStyle: { borderColor: '#0a1428', borderWidth: 0.6, areaColor: '#12263f' },
            emphasis: { label: { show: true, color: '#fff', fontSize: 11 }, itemStyle: { areaColor: '#f59e0b' } },
          }],
        });
        chart.off('click');
        chart.on('click', p => { if (p.data && p.data.city) openCityModal(p.data.city); });
      } catch (e) {
        // 任何一步失败：清理图表并显示明确错误，绝不留"加载中"
        chart.dispose();
        delete charts['chart-map'];
        showMapStatus('地图加载失败：' + (e && e.message ? e.message : e));
      }
    }
    async function loadOverview() {
      try {
        const j = await loadJSON('/api/overview');
        if (j.code !== 0) throw new Error(j.msg);
        state.top10 = j.data.top10 || [];
        el('update-time').textContent = j.data.update_time || '—';
        state.avgHeat = j.data.avg_heat;
        state.avgMom = j.data.avg_mom;
        renderTop10(); renderTrend();
      } catch (e) { el('chart-top10').innerHTML = '<div class="empty">数据加载失败，请确认后端已启动</div>'; }
    }
    async function loadTrend() {
      try {
        const j = await loadJSON('/api/trend?days=7');
        if (j.code !== 0) throw new Error(j.msg);
        state.trend = j.data || [];
        renderTrend();
      } catch (e) { /* 兜底 */ }
    }
    async function loadDailyOverview() {
      const body = el('overview-body');
      try {
        const j = await loadJSON('/api/ai/daily-overview');
        if (j.code !== 0) throw new Error(j.msg);
        body.innerHTML = '<div class="overview-text">' + escapeHtml(j.data.content) + '</div>';
      } catch (e) {
        body.innerHTML = '<div class="overview-text">AI 综述加载失败，请确认后端已启动并配置 DEEPSEEK_API_KEY。</div>';
      }
    }

    // ===== 图表渲染（TOP10 / 7日趋势） =====
    function renderTop10() {
      if (!state.top10.length) return;
      const c = initChart('chart-top10'); if (!c) return;
      const data = [...state.top10].reverse(); // 最高的排最上
      c.setOption({
        grid: { left: 6, right: 30, top: 6, bottom: 4, containLabel: true },
        tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' }, valueFormatter: v => Number(v).toFixed(1) },
        xAxis: { type: 'value', splitLine: { lineStyle: { color: '#16324f' } }, axisLabel: { color: textColor() } },
        yAxis: { type: 'category', data: data.map(d => d.city), axisLabel: { color: '#d7e8fb' }, axisLine: { lineStyle: { color: '#1c3553' } } },
        series: [{
          type: 'bar', data: data.map(d => d.heat_index), barWidth: '58%',
          itemStyle: { borderRadius: [0, 6, 6, 0], color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
            { offset: 0, color: '#2563eb' }, { offset: 1, color: '#22d3ee' }]) },
          label: { show: true, position: 'right', color: textColor(), fontSize: 11, formatter: p => p.value.toFixed(0) },
        }],
      });
    }

    function renderTrend() {
      if (!state.trend.length) return;
      const c = initChart('chart-trend'); if (!c) return;
      const labels = state.trend.map(d => d.date.slice(5));
      const values = state.trend.map(d => d.avg_heat);
      c.setOption({
        grid: { left: 6, right: 16, top: 20, bottom: 4, containLabel: true },
        tooltip: { trigger: 'axis' },
        xAxis: { type: 'category', data: labels, boundaryGap: false, axisLabel: { color: textColor() }, axisLine: { lineStyle: { color: '#1c3553' } } },
        yAxis: { type: 'value', splitLine: { lineStyle: { color: '#16324f' } }, axisLabel: { color: textColor() } },
        series: [{
          type: 'line', data: values, smooth: true, symbol: 'circle', symbolSize: 6,
          lineStyle: { width: 2.5, color: '#22d3ee' }, itemStyle: { color: '#22d3ee' },
          areaStyle: { color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
            { offset: 0, color: 'rgba(34,211,238,0.35)' }, { offset: 1, color: 'rgba(34,211,238,0)' }]) },
        }],
      });
    }

    // ===== 城市详情弹窗 =====
    async function openCityModal(city) {
      el('m-title').textContent = city;
      el('m-sub').textContent = '正在加载…';
      el('m-metrics').innerHTML = '';
      el('m-ai').textContent = '正在生成解读…';
      el('modal-mask').classList.add('show');

      try {
        const j = await loadJSON('/api/city/' + encodeURIComponent(city));
        if (j.code !== 0) throw new Error(j.msg);
        const d = j.data;
        el('m-sub').textContent = d.province || '';
        const latest = d.latest || {};
        el('m-metrics').innerHTML = [
          metric('综合热度', (latest.heat_index ?? '—').toFixed(1)),
          metric('搜索热度', (latest.search_heat ?? '—').toFixed(1)),
          metric('迁徙热度', (latest.migration_heat ?? '—').toFixed(1)),
          metric('景区热度', (latest.scenic_heat ?? '—').toFixed(1)),
          metric('环比', (latest.mom_change ?? 0).toFixed(1) + '%'),
        ].join('');
      } catch (e) {
        el('m-sub').textContent = '数据加载失败';
        el('m-metrics').innerHTML = '';
      }

      try {
        const j = await loadJSON('/api/ai/city/' + encodeURIComponent(city));
        if (j.code !== 0) throw new Error(j.msg);
        el('m-ai').textContent = j.data.content;
      } catch (e) {
        el('m-ai').textContent = 'AI 解读暂时不可用，请稍后再试。';
      }
    }
    function metric(k, v) {
      return `<div class="metric"><div class="k">${k}</div><div class="v">${v}</div></div>`;
    }

    // ===== 推荐 =====
    async function askRecommend() {
      const btn = el('btn-recommend');
      const result = el('recommend-result');
      btn.disabled = true;
      result.textContent = 'AI 正在为你挑选目的地…';
      try {
        const res = await fetch('/api/ai/recommend', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            origin: el('f-origin').value.trim(),
            days: Number(el('f-days').value),
            budget: el('f-budget').value,
            preference: el('f-pref').value.trim(),
          }),
        });
        const j = await res.json();
        result.textContent = j.code === 0 ? j.data.content : j.msg;
      } catch (e) {
        result.textContent = '推荐失败，请确认后端已启动并配置 DEEPSEEK_API_KEY。';
      } finally { btn.disabled = false; }
    }

    function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

    // ===== 事件与启动 =====
    el('btn-recommend').addEventListener('click', askRecommend);
    el('modal-close').addEventListener('click', () => el('modal-mask').classList.remove('show'));
    el('modal-mask').addEventListener('click', e => { if (e.target === el('modal-mask')) el('modal-mask').classList.remove('show'); });
    window.addEventListener('resize', () => Object.values(charts).forEach(c => c && c.resize()));

    // 启动：脚本位于 body 末尾，DOM 已就绪；地图顺序执行，其余并行加载
    initMap();
    loadOverview();
    loadTrend();
    loadDailyOverview();
  </script>
</body>
</html>

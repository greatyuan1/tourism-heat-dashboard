# Render Blueprint 配置（可选）
# 在 Render 控制台选择 "Blueprint" 部署时，会读取此文件自动创建服务。
# 也可忽略此文件，按控制台手动创建 Web Service（步骤见说明）。
services:
  - type: web
    name: tourism-heat-dashboard
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false            # 值在 Render 控制台手动填写
      - key: GAODE_API_KEY
        sync: false
      - key: DATA_MODE
        value: auto
